services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: daybook
      POSTGRES_USER: daybook
      POSTGRES_PASSWORD: daybook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - daybook_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daybook -d daybook"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://daybook:daybook@database:5432/daybook?schema=public
      APP_PASSWORD: ${APP_PASSWORD:-}
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://daybook:daybook@database:5432/daybook?schema=public
    restart: "no"

volumes:
  daybook_data:
